name: GGURO Dev CI/CD (Docker)

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 소스코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # Docker Buildx 설정
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Docker 캐시 복원
      - name: Restore Docker cache
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # GHCR 로그인
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # Docker 이미지 빌드 & 푸시
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/ae-gguro/gguro:latest
          build-args: |
            FIREBASE_KEY_JSON=${{ secrets.FIREBASE_KEY_JSON }}
            APPLE_PRIVATE_KEY=${{ secrets.APPLE_PRIVATE_KEY }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max

      # EC2에 배포
      - name: Deploy to EC2
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > ec2-key.pem
          chmod 400 ec2-key.pem

          ssh -i ec2-key.pem -o StrictHostKeyChecking=no ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << 'CMD'
            echo "DB_NAME=${{ secrets.DB_NAME }}" > /home/ubuntu/gguro/app.env
            echo "DB_USER=${{ secrets.DB_USER }}" >> /home/ubuntu/gguro/app.env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> /home/ubuntu/gguro/app.env
            echo "DB_HOST=${{ secrets.DB_HOST }}" >> /home/ubuntu/gguro/app.env
            echo "DB_PORT=${{ secrets.DB_PORT }}" >> /home/ubuntu/gguro/app.env
          
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> /home/ubuntu/gguro/app.env
          
            # Apple 로그인용
            echo "APPLE_CLIENT_ID=${{ secrets.APPLE_CLIENT_ID }}" >> /home/ubuntu/gguro/app.env
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> /home/ubuntu/gguro/app.env
            echo "APPLE_KEY_ID=${{ secrets.APPLE_KEY_ID }}" >> /home/ubuntu/gguro/app.env
            echo "APPLE_REDIRECT_URI=${{ secrets.APPLE_REDIRECT_URI }}" >> /home/ubuntu/gguro/app.env
            echo "APPLE_PRIVATE_KEY_PATH=classpath:keys/apple-private-key.p8" >> /home/ubuntu/gguro/app.env
          
            # S3
            echo "S3_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }}" >> /home/ubuntu/gguro/app.env
            echo "S3_SECRET_KEY=${{ secrets.S3_SECRET_KEY }}" >> /home/ubuntu/gguro/app.env
            echo "S3_BUCKET=${{ secrets.S3_BUCKET }}" >> /home/ubuntu/gguro/app.env
            echo "S3_REGION=${{ secrets.S3_REGION }}" >> /home/ubuntu/gguro/app.env
            echo "S3_PROFILE_IMAGE_PATH=${{ secrets.S3_PROFILE_IMAGE_PATH }}" >> /home/ubuntu/gguro/app.env
          
            echo "Pull latest Docker image..."
            docker compose pull gguro
          
            echo "Restart container..."
            docker compose up -d gguro
          
            echo "Deployment complete"
          CMD

          rm -f ec2-key.pem