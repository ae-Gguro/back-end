name: GGURO Dev CI/CD (Docker)

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      FIREBASE_KEY_JSON: ${{ secrets.FIREBASE_KEY_JSON }}

    steps:
      # -------------------------------
      # 1. 소스코드 체크아웃
      # -------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------------
      # 2. SSH 키 파일 생성
      # -------------------------------
      - name: Create SSH key file
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > ec2-key.pem
          chmod 400 ec2-key.pem

      # -------------------------------
      # 3. Firebase 키 파일 생성 (Base64 → JSON)
      # -------------------------------
      - name: Create Firebase key file
        run: |
          echo "${{ secrets.FIREBASE_KEY_JSON }}" | base64 -d > firebase_key.json
          echo "Firebase key created successfully"
          ls -lh firebase_key.json

      # -------------------------------
      # 4. EC2에 소스 및 Dockerfile 전송
      # -------------------------------
      - name: Copy files to EC2
        run: |
          rsync -avz -e "ssh -i ec2-key.pem -o StrictHostKeyChecking=no" \
          ./ ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/home/ubuntu/gguro/

      # -------------------------------
      # 5. EC2 내부에서 빌드 및 재시작
      # -------------------------------
      - name: Build & Run on EC2
        run: |
          ssh -i ec2-key.pem -o StrictHostKeyChecking=no ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} <<EOF
            set -e
            cd /home/ubuntu/gguro

            echo "Update app.env ..."
            cat > app.env <<EOL
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            APPLE_CLIENT_ID=${{ secrets.APPLE_CLIENT_ID }}
            APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}
            APPLE_KEY_ID=${{ secrets.APPLE_KEY_ID }}
            APPLE_REDIRECT_URI=${{ secrets.APPLE_REDIRECT_URI }}
            APPLE_PRIVATE_KEY_PATH=classpath:keys/apple-private-key.p8
            S3_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }}
            S3_SECRET_KEY=${{ secrets.S3_SECRET_KEY }}
            S3_BUCKET=${{ secrets.S3_BUCKET }}
            S3_REGION=${{ secrets.S3_REGION }}
            S3_PROFILE_IMAGE_PATH=${{ secrets.S3_PROFILE_IMAGE_PATH }}
            EOL

            echo "Stop previous container (if running)..."
            docker compose down || true

            echo "Build new Docker image..."
            docker build \
              --build-arg APPLE_PRIVATE_KEY='${{ secrets.APPLE_PRIVATE_KEY }}' \
              -t gguro .

            echo "Start new container..."
            FIREBASE_KEY_JSON='${{ secrets.FIREBASE_KEY_JSON }}' \
            docker compose up -d --build gguro

            echo "Deployment complete"
          EOF

      # -------------------------------
      # 6. SSH 키 정리
      # -------------------------------
      - name: Clean up SSH key
        run: rm -f ec2-key.pem
