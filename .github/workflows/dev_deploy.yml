name: GGURO Dev CI/CD (Docker)

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 소스코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # SSH 키 생성
      - name: Create SSH key file
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > ec2-key.pem
          chmod 400 ec2-key.pem

      # EC2에 소스 및 Dockerfile 전송
      - name: Copy files to EC2
        run: |
          rsync -avz -e "ssh -i ec2-key.pem -o StrictHostKeyChecking=no" \
          ./ ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/home/ubuntu/gguro/

      # EC2에서 Docker 빌드 및 재시작
      - name: Build & Run on EC2
        run: |
          ssh -i ec2-key.pem -o StrictHostKeyChecking=no ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << 'CMD'
            set -e
            cd /home/ubuntu/gguro

            echo "Update app.env ..."
            cat > app.env <<EOF
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            APPLE_CLIENT_ID=${{ secrets.APPLE_CLIENT_ID }}
            APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}
            APPLE_KEY_ID=${{ secrets.APPLE_KEY_ID }}
            APPLE_REDIRECT_URI=${{ secrets.APPLE_REDIRECT_URI }}
            APPLE_PRIVATE_KEY_PATH=classpath:keys/apple-private-key.p8
            S3_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }}
            S3_SECRET_KEY=${{ secrets.S3_SECRET_KEY }}
            S3_BUCKET=${{ secrets.S3_BUCKET }}
            S3_REGION=${{ secrets.S3_REGION }}
            S3_PROFILE_IMAGE_PATH=${{ secrets.S3_PROFILE_IMAGE_PATH }}
            EOF

            echo "Build new Docker image..."
            docker-compose down || true
            docker build \
            --build-arg FIREBASE_KEY_JSON='${{ secrets.FIREBASE_KEY_JSON }}' \
            --build-arg APPLE_PRIVATE_KEY='${{ secrets.APPLE_PRIVATE_KEY }}' \
            -t gguro .
      
            echo "Starting container..."
            docker-compose up -d gguro
      
            echo "Deployment complete"
          CMD

      # firebase 디버그 확인
      - name: Debug Firebase Key
        run: |
          echo "Length of FIREBASE_KEY_JSON: ${#FIREBASE_KEY_JSON}"

      # SSH 키 정리
      - name: Clean up SSH key
        run: rm -f ec2-key.pem