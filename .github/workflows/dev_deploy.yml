name: GGURO Dev CI/CD

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'develop'

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: temurin

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Create application-prod.yml (PostgreSQL)
        run: |
          mkdir -p src/main/resources
          echo "spring:" > src/main/resources/application-prod.yml
          echo "  config:" >> src/main/resources/application-prod.yml
          echo "    activate:" >> src/main/resources/application-prod.yml
          echo "      on-profile: prod" >> src/main/resources/application-prod.yml
          echo "  datasource:" >> src/main/resources/application-prod.yml
          echo "    url: jdbc:postgresql://\${DB_HOST}:\${DB_PORT}/\${DB_NAME}" >> src/main/resources/application-prod.yml
          echo "    username: \${DB_USER}" >> src/main/resources/application-prod.yml
          echo "    password: \${DB_PASSWORD}" >> src/main/resources/application-prod.yml
          echo "    driver-class-name: org.postgresql.Driver" >> src/main/resources/application-prod.yml
          echo "  sql:" >> src/main/resources/application-prod.yml
          echo "    init:" >> src/main/resources/application-prod.yml
          echo "      mode: never" >> src/main/resources/application-prod.yml
          echo "  jpa:" >> src/main/resources/application-prod.yml
          echo "    properties:" >> src/main/resources/application-prod.yml
          echo "      hibernate:" >> src/main/resources/application-prod.yml
          echo "        dialect: org.hibernate.dialect.PostgreSQLDialect" >> src/main/resources/application-prod.yml
          echo "        show_sql: false" >> src/main/resources/application-prod.yml
          echo "        format_sql: false" >> src/main/resources/application-prod.yml
          echo "        use_sql_comments: false" >> src/main/resources/application-prod.yml
          echo "        hbm2ddl:" >> src/main/resources/application-prod.yml
          echo "          auto: update" >> src/main/resources/application-prod.yml
          echo "        default_batch_fetch_size: 1000" >> src/main/resources/application-prod.yml
          echo "" >> src/main/resources/application-prod.yml
          echo "server:" >> src/main/resources/application-prod.yml
          echo "  port: 443" >> src/main/resources/application-prod.yml
          echo "  ssl:" >> src/main/resources/application-prod.yml
          echo "    enabled: true" >> src/main/resources/application-prod.yml
          echo "    key-store: /opt/gguro/keystore.p12" >> src/main/resources/application-prod.yml
          echo "    key-store-password: gguro1234" >> src/main/resources/application-prod.yml
          echo "    key-store-type: PKCS12" >> src/main/resources/application-prod.yml
          echo "    key-alias: springboot-cert" >> src/main/resources/application-prod.yml
          echo "apple:" >> src/main/resources/application-prod.yml
          echo "  redirect-uri: https://gguro.store/api/auth/apple" >> src/main/resources/application-prod.yml

      - name: Build with Gradle
        run: ./gradlew clean bootJar -x test

      - name: Create SSH key file
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > ec2-key.pem
          chmod 400 ec2-key.pem

      - name: Copy .jar to EC2
        run: |
          scp -i ec2-key.pem -o StrictHostKeyChecking=no ./build/libs/gguro-1.0.0.jar \
          ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/home/ubuntu/gguro/gguro-1.0.0.jar

      - name: Update env file & restart service
        run: |
          ssh -i ec2-key.pem -o StrictHostKeyChecking=no ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << 'CMD'
            echo "DB_NAME=${{ secrets.DB_NAME }}" > /home/ubuntu/gguro/app.env
            echo "DB_USER=${{ secrets.DB_USER }}" >> /home/ubuntu/gguro/app.env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> /home/ubuntu/gguro/app.env
            echo "DB_HOST=${{ secrets.DB_HOST }}" >> /home/ubuntu/gguro/app.env
            echo "DB_PORT=${{ secrets.DB_PORT }}" >> /home/ubuntu/gguro/app.env

            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> /home/ubuntu/gguro/app.env
            echo "APPLE_CLIENT_ID=${{ secrets.APPLE_CLIENT_ID }}" >> /home/ubuntu/gguro/app.env
            echo "S3_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }}" >> /home/ubuntu/gguro/app.env
            echo "S3_SECRET_KEY=${{ secrets.S3_SECRET_KEY }}" >> /home/ubuntu/gguro/app.env

            sudo systemctl daemon-reload
            sudo systemctl restart gguro
            sudo systemctl enable gguro
          CMD
